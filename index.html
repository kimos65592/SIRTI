<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05080f">
<title>J.A.R.V.I.S — Cognitive OS</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
body{background:#05080f;color:#edf6ff;padding:14px}
.app{width:min(1200px,100%);margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;background:#09111c;border:1px solid #1a2c40;border-radius:16px}
.brand{display:flex;align-items:center;gap:10px}
.orb{width:42px;height:42px;border-radius:50%;border:1px solid #62d8ff;background:radial-gradient(circle,#dffaff 0 8%,#4bcdf4 10% 26%,#123a50 43%,#06111a 70%);box-shadow:0 0 24px rgba(98,216,255,.3)}
.title{font-weight:800;letter-spacing:.08em}
.sub{font-size:11px;color:#8095aa;margin-top:2px}
.status{font-size:12px;color:#6fe4a2}
.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:14px;margin-top:14px}
.panel{background:#09111c;border:1px solid #1a2c40;border-radius:16px;overflow:hidden}
.panel-title{padding:12px 14px;border-bottom:1px solid #1a2c40;font-size:12px;color:#bcd8ec}
.chat{height:68vh;min-height:440px;display:flex;flex-direction:column}
.messages{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:9px}
.msg{max-width:88%;padding:10px 12px;border-radius:13px;line-height:1.65;white-space:pre-wrap;font-size:14px}
.user{align-self:flex-start;background:#122033;border:1px solid #1d3850}
.jarvis{align-self:flex-end;background:#0b1721;border:1px solid #24465d}
.meta{font-size:10px;color:#7890a6;margin-bottom:3px}
form{display:flex;gap:8px;padding:10px;border-top:1px solid #1a2c40}
input{flex:1;min-width:0;background:#050a12;color:#fff;border:1px solid #263b52;border-radius:11px;padding:12px;outline:none;font-size:14px}
input:focus{border-color:#62d8ff}
button{background:#102538;color:#e8f8ff;border:1px solid #29465e;border-radius:11px;padding:0 16px;font-weight:700;cursor:pointer}
button:hover{background:#15324a}
button:disabled{opacity:.5;cursor:not-allowed}
.side{display:flex;flex-direction:column}
.section{padding:12px;border-bottom:1px solid #162537}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed #18283a;font-size:12px}
.row:last-child{border-bottom:0}
.label{color:#8195aa}.value{font-weight:650;text-align:left;max-width:65%}
.log{max-height:180px;overflow:auto;background:#05090f;padding:9px;color:#9cb0c5;font:11px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;direction:ltr;text-align:left}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.tag{font-size:10px;border:1px solid #28455b;border-radius:999px;padding:4px 7px;color:#bfeaff}
.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
@media(max-width:850px){.grid{grid-template-columns:1fr}.chat{height:62vh}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="orb"></div>
      <div>
        <div class="title">J.A.R.V.I.S — COGNITIVE OS</div>
        <div class="sub">Reviewed build • Web Cognitive Laboratory</div>
      </div>
    </div>
    <div class="status" id="headerStatus">● ONLINE</div>
  </header>

  <div class="grid">
    <section class="panel chat">
      <div class="panel-title">المحادثة</div>
      <div id="messages" class="messages"></div>

      <form id="chatForm" autocomplete="off">
        <input id="userInput" type="text" placeholder="اكتب إلى J.A.R.V.I.S..." />
        <button id="sendButton" type="submit">إرسال</button>
      </form>

      <div class="tools">
        <button id="voiceButton" type="button">🔊 الصوت</button>
        <button id="clearButton" type="button">مسح المحادثة</button>
      </div>
    </section>

    <aside class="panel side">
      <div class="panel-title">COGNITIVE STATE</div>

      <div class="section">
        <div class="row"><span class="label">الحالة</span><span class="value" id="systemState">ONLINE</span></div>
        <div class="row"><span class="label">المعالجة</span><span class="value" id="processing">idle</span></div>
        <div class="row"><span class="label">الثقة</span><span class="value" id="confidence">50%</span></div>
        <div class="row"><span class="label">الانتباه</span><span class="value" id="attention">86%</span></div>
        <div class="row"><span class="label">عدم اليقين</span><span class="value" id="uncertainty">50%</span></div>
        <div class="row"><span class="label">الهدف الحالي</span><span class="value" id="goal">لا يوجد</span></div>
      </div>

      <div class="section">
        <div class="row"><span class="label">Intent</span><span class="value" id="intent">unknown</span></div>
        <div class="row"><span class="label">Sub-intent</span><span class="value" id="subIntent">—</span></div>
        <div id="analysisExtras"></div>
      </div>

      <div class="section">
        <div class="panel-title" style="border:0;padding:0 0 8px">الذاكرة</div>
        <div id="memoryView">فارغة</div>
      </div>

      <div class="section">
        <div class="panel-title" style="border:0;padding:0 0 8px">الخطة</div>
        <div id="planView">لا توجد خطة.</div>
      </div>

      <div class="section">
        <div class="panel-title" style="border:0;padding:0 0 8px">EVENT BUS</div>
        <pre id="eventLog" class="log"></pre>
      </div>
    </aside>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
