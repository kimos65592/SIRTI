<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#00ffcc">

    <link rel="manifest" href="./manifest.json">

    <title>J.A.R.V.I.S - V1</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background-color: #050505;
            color: #00ffcc;
            font-family: monospace;
        }

        .hud-border {
            border: 1px solid rgba(0, 255, 204, 0.3);
        }

        .mic-active {
            box-shadow: 0 0 20px #00ffcc;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body class="h-screen flex flex-col items-center justify-between p-6">

    <!-- Header -->
    <header class="w-full text-center py-4 hud-border rounded-lg bg-black/50">

        <h1 class="text-2xl font-bold tracking-widest">
            J.A.R.V.I.S
        </h1>

        <p id="status-text"
           class="text-xs text-gray-400 mt-1">
            SYSTEM STANDBY
        </p>

    </header>


    <!-- Conversation -->
    <main
        id="chat-log"
        class="flex-1 w-full mt-4 p-4 hud-border rounded-lg overflow-y-auto flex flex-col-reverse">
    </main>


    <!-- Microphone -->
    <footer class="w-full py-6 flex justify-center">

        <button
            id="btn-mic"
            class="w-20 h-20 rounded-full border-2 border-[#00ffcc]
                   text-[#00ffcc] flex items-center justify-center
                   text-3xl transition-all duration-300
                   focus:outline-none bg-black/50">

            🎙️

        </button>

    </footer>


    <script src="./app.js"></script>


    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {

            window.addEventListener('load', () => {

                navigator.serviceWorker
                    .register('./service-worker.js')
                    .then(reg => {
                        console.log(
                            'Service Worker registered:',
                            reg.scope
                        );
                    })
                    .catch(err => {
                        console.error(
                            'Service Worker registration failed:',
                            err
                        );
                    });

            });

        }
    </script>

</body>
</html>
